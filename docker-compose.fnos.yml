# ==============================================================================
# Home KTV - 飞牛 fnOS (NAS) 生产环境专属 Docker Compose 编排文件
# 适用场景：飞牛 fnOS 容器管理 / Docker Compose 项目部署
# 特性：
#   1. 支持直接基于工作区源码构建（集成在线 MV 下载、单轨转双轨伴奏与 H5 优化全量最新特性）
#   2. 支持对接服务器现有 PostgreSQL（默认端口 5433，密码 12345678.）或内置独立数据库
#   3. 透传 Intel 核显 /dev/dri 开启 VAAPI 硬件转码加速
#   4. 开放 8080 (Web/API/WebSocket/媒体) 与 18888 (电视端 UDP 服务发现)
# ==============================================================================
name: home-ktv

services:
  # --------------------------------------------------------------------------
  # 后端及前端整合服务 (包含 Spring Boot 3.5、Vue 3 H5、FFmpeg 与音视频处理引擎)
  # --------------------------------------------------------------------------
  ktv:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BASE_REGISTRY: docker.m.daocloud.io
    image: home-ktv:latest
    container_name: ktv-app
    restart: unless-stopped
    stop_grace_period: 30s
    devices:
      # 飞牛 fnOS Intel 核显透传（用于 VAAPI 极速硬件转码与音视频处理）
      - /dev/dri:/dev/dri
    # NVIDIA 独显加速支持（若宿主机安装了 NVIDIA Container Toolkit，取消下方注释即刻开启 CUDA 硬件加速）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      # 服务监听端口（与下方发布的 TCP 端口一致）
      SERVER_PORT: 8080
      # 数据库连接：默认连接到当前宿主机已部署的 PostgreSQL（端口 5433）
      # 如需使用下方内置的 db 容器，请将 URL 改为：jdbc:postgresql://db:5432/ktv
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://10.17.220.79:5433/ktv}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-ktv}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-12345678.}
      # 媒体路径映射
      KTV_SOURCE_LIBRARY_PATH: /source-music
      KTV_LIBRARY_PATH: /music
      KTV_DATA_PATH: /data
      # 单轨转双轨伴奏系统 (方案B: UVR-MDX-Net 深度学习 AI 伴奏分离)
      KTV_DUAL_TRACK_ENGINE: "REMOTE_AI"
      KTV_DUAL_TRACK_REMOTE_URL: "http://ai-service:8900/api/separate"
      # 局域网服务发现配置
      KTV_DISCOVERY_ENABLED: "true"
      KTV_DISCOVERY_UDP_PORT: 18888
      KTV_DISCOVERY_NAME: "家庭KTV"
      # AI 模型配置（默认关闭，可随时在后台系统设置中接入 DeepSeek 等兼容接口）
      KTV_AI_ENABLED: "false"
      KTV_AI_BASE_URL: "https://api.deepseek.com"
      KTV_AI_API_KEY: ""
      KTV_AI_MODEL: "deepseek-v4-flash"
      KTV_AI_AUTO_APPLY_CONFIDENCE: "0.90"
      # JVM 内存调优参数
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Xmx768m"
      TZ: Asia/Shanghai
    ports:
      # 面向手机端 H5、浏览器管理后台、电视端业务通信与媒体推流
      - "8080:8080/tcp"
      # 电视端自动局域网发现端口
      - "18888:18888/udp"
    volumes:
      # 原始素材上传/下载目录（建议挂载至 NAS 机械硬盘或 SSD 存储空间）
      - type: bind
        source: ./source-music
        target: /source-music
        bind:
          create_host_path: true
      # 整理归档后的精选曲库目录
      - type: bind
        source: ./music
        target: /music
        bind:
          create_host_path: true
      # 应用运行元数据、封面、歌词与临时转码缓存
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      ai-service:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # UVR-MDX-Net 深度学习人声伴奏分离微服务 (方案B: 生产环境母带级高保真分离)
  # 支持 Intel/AMD 核显透传 (/dev/dri) 及 NVIDIA 独显 (CUDA / DirectML) 加速
  # --------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        BASE_REGISTRY: docker.m.daocloud.io
    image: home-ktv-ai:latest
    container_name: ktv-ai
    restart: unless-stopped
    stop_grace_period: 15s
    devices:
      # 核显硬件加速透传 (Intel/AMD)
      - /dev/dri:/dev/dri
    # NVIDIA 独显加速支持（若宿主机安装了 NVIDIA Container Toolkit，取消下方注释即刻开启 CUDA 硬件加速）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      UVR_PORT: 8900
      TZ: Asia/Shanghai
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # 挂载 AI 模型目录，支持持久化及动态热替换模型
      - type: bind
        source: ./ai-service/models
        target: /app/models
        bind:
          create_host_path: true
    ports:
      # 暴露 AI 微服务 HTTP 接口，可供宿主机或其他局域网服务调用
      - "8900:8900/tcp"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # 内置独立 PostgreSQL 服务（备选：若不复用宿主机 5433 现有库，可取消注释并启用）
