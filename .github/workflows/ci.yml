name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run server tests
        run: ./mvnw --batch-mode test
      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  h5:
    name: H5 tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: h5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: h5/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run H5 tests
        run: npm test
      - name: Build H5
        run: npm run build

  android-tv:
    name: TV release-variant checks
    runs-on: ubuntu-latest
    env:
      KTV_TV_VERSION_NAME: 0.1.0-unstable.${{ github.run_number }}
      KTV_TV_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify FFmpeg extension
        run: echo "9feed2a29f7717955f579eff0373503ef3f8681734b053797fbda3cf62b3a5ab  app/libs/media3-decoder-ffmpeg.aar" | sha256sum -c -
      - name: Run release-variant tests and lint
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease
      - name: Upload TV reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-reports
          path: android-tv/app/build/reports/
